name: Build → branche hostinger-deploy

# ═══════════════════════════════════════════════════════════════════════════
# POURQUOI CETTE BRANCHE EXISTE
#
# L'intégration Git de hPanel (Hostinger) copie le contenu du dépôt TEL QUEL
# dans public_html : elle n'exécute AUCUNE commande de build. Or ce site est
# en Astro — ce qui doit être servi, c'est le dossier `dist/` compilé, pas les
# sources. Brancher Hostinger sur `main` déploierait src/, package.json, etc.,
# et le site ne s'afficherait pas.
#
# Ce workflow maintient donc une branche `hostinger-deploy` qui contient le
# site COMPILÉ à sa racine. C'est cette branche qu'il faut sélectionner dans
# hPanel → Websites → Dashboard → Advanced → Git.
#
# La branche est un ARTEFACT de build : chaque build y ajoute un commit qui
# remplace tout son contenu par le nouveau dist/ (son historique n'a aucune
# valeur, il sert seulement à n'envoyer que les fichiers modifiés). Ne jamais
# y committer à la main.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    # Un changement purement CI ne modifie pas le site rendu.
    paths-ignore:
      - '.github/**'
      - 'README.md'
  workflow_dispatch:
  # Reconstruction quotidienne : les avis clients publiés dans l'admin sont
  # lus au moment du build (pages statiques + étoiles Google).
  schedule:
    - cron: '30 4 * * *'

# Deux builds concurrents pousseraient en force sur la même branche : on
# sérialise, et on annule le build devenu obsolète.
concurrency:
  group: hostinger-deploy-branch
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Filet de sécurité : un build normal dure ~4 min.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Garde-fou : sans .htaccess, on perd la redirection HTTPS, les en-têtes
      # de sécurité, la réécriture du sitemap et le fallback i18n /en /de.
      # Mieux vaut échouer ici que déployer un site silencieusement dégradé.
      - name: Vérifier le contenu du build
        run: |
          test -f dist/index.html    || { echo "::error::dist/index.html manquant"; exit 1; }
          test -f dist/.htaccess     || { echo "::error::dist/.htaccess manquant"; exit 1; }
          test -f dist/sitemap-index.xml || echo "::warning::sitemap-index.xml absent"
          echo "Pages générées : $(find dist -name '*.html' | wc -l)"

      # Push INCRÉMENTAL : dist/ pèse ~1,1 Go (images surtout). L'ancienne
      # méthode (git init + commit orphelin + push --force) renvoyait TOUT le
      # gigaoctet à chaque build, d'où des push de 1 à 2 min qui, une fois sur
      # deux, se figeaient sans fin (silencieux à cause de --quiet).
      # Désormais on récupère seulement les arbres du dernier commit de la
      # branche (--filter=blob:none : aucun fichier téléchargé) et on crée le
      # nouveau commit par-dessus : git n'envoie que les fichiers modifiés.
      - name: Pousser dist/ sur la branche hostinger-deploy
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Jamais d'attente d'identifiants : échouer plutôt que bloquer.
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -b hostinger-deploy
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          # Transfert bloqué (< 1 Ko/s pendant 60 s) : on coupe et on réessaie.
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Marqueur de déploiement : https://moroji.com/build-info.txt dit quel
          # commit est en ligne (et garantit un commit par build).
          printf 'commit=%s\nrun=%s\ndate=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > build-info.txt

          git add -A
          TREE=$(git write-tree)
          MSG="build: ${GITHUB_SHA::7}, $(find . -name '*.html' -not -path './.git/*' | wc -l | tr -d ' ') pages"

          if timeout 120 git fetch -q --depth=1 --filter=blob:none --no-tags origin hostinger-deploy; then
            PARENT=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "${PARENT}^{tree}")" = "$TREE" ]; then
              echo "✅ build identique à la branche hostinger-deploy, rien à pousser"
              exit 0
            fi
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            echo "::warning::branche hostinger-deploy introuvable, création d'un commit orphelin"
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi

          # --no-thin : pas de delta contre les fichiers absents localement
          # (sinon git les téléchargerait un par un). --force-with-lease : on
          # écrase seulement si la branche n'a pas bougé depuis le fetch.
          LEASE="--force-with-lease=refs/heads/hostinger-deploy:${PARENT:-}"
          for attempt in 1 2 3; do
            if timeout 300 git push --no-thin "$LEASE" origin "${COMMIT}:refs/heads/hostinger-deploy"; then
              echo "✅ branche hostinger-deploy mise à jour depuis ${GITHUB_SHA::7} ($(git rev-parse --short "$COMMIT"))"
              exit 0
            fi
            echo "::warning::push échoué ou bloqué (tentative ${attempt}/3), nouvel essai dans 15 s"
            sleep 15
          done
          echo "::error::impossible de pousser sur hostinger-deploy après 3 tentatives"
          exit 1
