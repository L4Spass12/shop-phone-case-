name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
    # Un changement purement CI (workflows) ne modifie pas le site : inutile de
    # relancer un déploiement FTP complet (~20 min). Les commits de contenu, eux,
    # touchent src/ et déclenchent bien le déploiement.
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: hostinger-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/deploy-ftp.sh
