name: Build & Deploy to Hostinger

# ═══════════════════════════════════════════════════════════════════════════
# ⚠️ DÉPLOIEMENT FTP — DÉSORMAIS MANUEL UNIQUEMENT (repli de secours).
#
# Le déploiement se fait maintenant par l'intégration Git de hPanel, branchée
# sur la branche `hostinger-deploy` (voir hostinger-branch.yml).
#
# Le déclencheur `push` a été retiré VOLONTAIREMENT : si les deux mécanismes
# tournaient en parallèle, ils écriraient en même temps dans public_html
# (le FTP prend ~20 min, le Git quelques secondes) — on obtiendrait un site
# à moitié mis à jour, avec des HTML pointant vers des assets déjà remplacés.
#
# Reste utile pour : reprendre la main si l'intégration Git tombe, ou forcer
# un rafraîchissement complet par FTP. Lancement : onglet Actions → ce
# workflow → « Run workflow ».
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: hostinger-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/deploy-ftp.sh
