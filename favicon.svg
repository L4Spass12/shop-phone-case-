<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vareska">
  <rect width="100" height="100" rx="24" fill="#111113"/>
  <!--
    Monogramme « V » — tracé asymétrique volontaire : la branche descendante
    est large, la remontante fine, comme un tracé à la plume. Un V symétrique
    ressemble à un chevron générique ; cette différence d'épaisseur suffit à
    lui donner un caractère gravé, sans ajouter d'ornement.

    Dessiné en <path> et non en <text> : indépendant des polices installées,
    et lisible jusqu'à 16px dans un onglet.
  -->
  <path
    fill="#FFFFFF"
    d="M22 26
       L38 26
       L52.5 66.5
       L64 26
       L78 26
       L58.5 78
       L44 78
       Z"
  />
</svg>
