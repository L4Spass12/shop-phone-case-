<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vareska">
  <rect width="100" height="100" rx="22" fill="#111113"/>
  <!--
    Monogramme « V » tracé en path : indépendant des polices système (un
    <text> se rendrait différemment selon l'OS) et lisible jusqu'à 16px.
    Les branches s'affinent vers la pointe, ce qui donne un tracé gravé
    plutôt qu'un simple chevron géométrique.
  -->
  <path
    fill="#FFFFFF"
    d="M24 27 L37.5 27 L50 63 L62.5 27 L76 27 L57 77 L43 77 Z"
  />
</svg>
